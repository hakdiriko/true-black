name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk TrueBlack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrueBlack
          path: TrueBlack.apk

      - name: Publish APK to the apk branch
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/apk && cp TrueBlack.apk /tmp/apk/
          git checkout --orphan apk
          git rm -rfq . && rm -rf app gradle keystore .github
          cp /tmp/apk/TrueBlack.apk .
          echo "True Black — latest build from main ($GITHUB_SHA)" > README.md
          git add TrueBlack.apk README.md
          git commit -q -m "APK build $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
          git push -f origin apk
